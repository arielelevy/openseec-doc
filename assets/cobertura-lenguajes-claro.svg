<text x="24" y="774" font-size="12" fill="#52514e">Secretos (Gitleaks 8.30.1): todos los archivos permitidos, sin importar el lenguaje. «No analizado» nunca significa «sin riesgos».</text>
<text x="24" y="792" font-size="12" fill="#52514e">«Parcial»: alcance acotado (reglas sin holdout, chequeo de delimitadores o grafo que sobreaproxima).</text>
<text x="24" y="810" font-size="12" fill="#52514e">Java, Ruby, Objective-C, Go, Rust y Dockerfile no pasaron el holdout de otro autor: sus reglas siguen «Sin medir».</text>
<text x="24" y="828" font-size="12" fill="#52514e">C# conserva evidencia histórica; la ampliación Rev15 tiene controles DEV, sin holdout nuevo: alcance parcial.</text>
